<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cw-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cw-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#cw-bg)"/>
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="8" stroke-dasharray="12 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="105" stroke="#475569" stroke-width="6" opacity="0.8"/>
  <circle cx="256" cy="256" r="45" stroke="#6366f1" stroke-width="6" opacity="0.9"/>
  <!-- Radar sweep wedge -->
  <path d="M256 256 L395 175 A160 160 0 0 0 256 96 Z" fill="url(#cw-accent)" opacity="0.25"/>
  <!-- Contract sheet & checkmark shield -->
  <rect x="180" y="150" width="152" height="212" rx="20" fill="#1e293b" stroke="#475569" stroke-width="8"/>
  <line x1="215" y1="210" x2="297" y2="210" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="245" x2="275" y2="245" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="280" x2="297" y2="280" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <!-- Active radar blip / shield indicator -->
  <circle cx="340" cy="180" r="28" fill="url(#cw-shield)"/>
  <path d="M331 180 L337 186 L350 173" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
